  <style>
    :root {
      --burgundy: #80000a;
      --burgundy-dark: #5a0007;
      --burgundy-light: #a8192a;
      --gold: #c9a227;
      --gold-dark: #9a7a1a;
      --gold-light: #e0bc4a;
      --black: #0a0a0a;
      --gray-950: #121212;
      --gray-900: #1a1a1a;
      --gray-800: #242424;
      --gray-700: #333333;
      --gray-600: #444444;
      --gray-500: #666666;
      --gray-400: #888888;
      --gray-300: #aaaaaa;
      --gray-200: #cccccc;
      --gray-100: #e0e0e0;
      --white: #ffffff;
      --win: #2e7d32;
      --loss: #c62828;
      --draw: #666666;
      --font-display: 'Oswald', sans-serif;
      --font-body: 'Source Sans 3', sans-serif;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 64px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--black);
      color: var(--gray-100);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .site-header {
      background: linear-gradient(180deg, var(--gray-900) 0%, var(--black) 100%);
      border-bottom: 1px solid var(--gray-800);
      padding: var(--space-md) var(--space-lg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-lg);
    }

    .logo-link {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-wordmark { height: 32px; width: auto; }

    .nav-section {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }

    .nav-link {
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-link:hover { color: var(--gold-light); }

    .nav-active {
      color: var(--white);
      cursor: default;
    }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--burgundy-dark) 0%, var(--gray-950) 50%, var(--gray-900) 100%);
      padding: var(--space-3xl) var(--space-lg);
      text-align: center;
    }

    .hero-content {
      max-width: 800px;
      margin: 0 auto;
    }

    .hero-subtitle {
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--gold);
      margin-bottom: var(--space-sm);
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: var(--space-md);
    }

    .hero-title span { color: var(--gold); }

    .hero-record {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--gray-200);
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-lg);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-lg);
      margin-bottom: var(--space-xl);
    }

    .stats-card {
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
    }

    .stats-card-title {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gray-400);
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--gray-800);
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-sm) 0;
    }

    .stats-label {
      font-size: 0.9rem;
      color: var(--gray-300);
    }

    .stats-value {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gold);
    }

    .stats-value.win { color: var(--win); }
    .stats-value.loss { color: var(--loss); }

    /* Record Display */
    .record-display {
      display: flex;
      justify-content: center;
      gap: var(--space-xl);
      margin-bottom: var(--space-md);
    }

    .record-item {
      text-align: center;
    }

    .record-number {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
    }

    .record-number.win { color: var(--win); }
    .record-number.draw { color: var(--gray-400); }
    .record-number.loss { color: var(--loss); }

    .record-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gray-400);
      margin-top: var(--space-xs);
    }

    /* Streak Badge */
    .streak-badge {
      display: inline-block;
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .streak-badge.W { background: var(--win); color: var(--white); }
    .streak-badge.L { background: var(--loss); color: var(--white); }
    .streak-badge.D { background: var(--gray-600); color: var(--white); }

    /* Section Headers */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-md);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gray-400);
    }

    /* Match Cards */
    .matches { display: flex; flex-direction: column; gap: var(--space-md); }

    .match-card {
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .match-card:hover {
      transform: translateY(-2px);
      border-color: var(--gray-700);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .match-card.win { border-left: 4px solid var(--win); }
    .match-card.loss { border-left: 4px solid var(--loss); }
    .match-card.draw { border-left: 4px solid var(--gray-500); }

    .match-main { padding: var(--space-lg); }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--space-md);
    }

    .match-meta { display: flex; flex-direction: column; gap: var(--space-xs); }

    .match-date {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-400);
    }

    .match-competition { font-size: 0.75rem; color: var(--gray-500); }

    .match-badges { display: flex; gap: var(--space-sm); flex-wrap: wrap; }

    .badge {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge.result-w { background: var(--win); color: var(--white); }
    .badge.result-l { background: var(--loss); color: var(--white); }
    .badge.result-d { background: var(--gray-600); color: var(--white); }
    .badge.playoff { background: var(--burgundy); color: var(--white); }
    .badge.robbed { background: var(--gold); color: var(--black); }
    .badge.smash { background: #00838f; color: var(--white); }

    .match-score-row {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .team-name {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .team-name.atlanta { color: var(--gold); }
    .team-name.opponent { color: var(--gray-100); }

    .score-display { display: flex; align-items: center; gap: var(--space-sm); }

    .score {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--white);
      min-width: 36px;
      text-align: center;
    }

    .score-separator { font-size: 1.25rem; color: var(--gray-500); }

    .venue-indicator {
      font-size: 0.75rem;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .match-xg { display: flex; gap: var(--space-lg); flex-wrap: wrap; }

    .xg-item { display: flex; align-items: baseline; gap: var(--space-xs); }

    .xg-label {
      font-size: 0.75rem;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .xg-value {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      color: var(--gold);
    }

    .xg-value.positive { color: var(--win); }
    .xg-value.negative { color: var(--loss); }

    /* Expand Hint */
    .expand-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: var(--space-sm);
      padding-top: var(--space-sm);
      border-top: 1px solid var(--gray-800);
      color: var(--gray-500);
      font-size: 0.7rem;
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      gap: var(--space-xs);
      transition: color 0.2s;
    }

    .match-card:hover .expand-hint { color: var(--gray-300); }

    .expand-hint::after {
      content: '';
      width: 8px;
      height: 8px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      transition: transform 0.3s ease;
      margin-bottom: 4px;
    }

    .match-card.expanded .expand-hint::after {
      transform: rotate(-135deg);
      margin-bottom: -2px;
    }

    /* Expanded Details */
    .match-details {
      display: none;
      padding: var(--space-lg);
      background: var(--gray-950);
      border-top: 1px solid var(--gray-800);
    }

    .match-card.expanded .match-details { display: block; }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: var(--space-md);
    }

    .detail-item { display: flex; flex-direction: column; gap: 2px; }

    .detail-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .detail-value { font-size: 0.9rem; color: var(--gray-200); }

    /* Opponent Navigation */
    .opponent-nav {
      margin-top: var(--space-xl);
      padding: var(--space-lg);
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: var(--radius-lg);
    }

    .opponent-nav-title {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gray-400);
      margin-bottom: var(--space-md);
    }

    .opponent-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }

    .opponent-link {
      padding: var(--space-xs) var(--space-sm);
      background: var(--gray-800);
      border: 1px solid var(--gray-700);
      border-radius: var(--radius-sm);
      color: var(--gray-200);
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .opponent-link:hover {
      background: var(--gray-700);
      border-color: var(--gold);
      color: var(--gold);
    }

    .opponent-link.active {
      background: var(--burgundy);
      border-color: var(--burgundy);
      color: var(--white);
    }

    /* Loading & Error States */
    .loading, .error-state {
      text-align: center;
      padding: var(--space-3xl);
      color: var(--gray-400);
    }

    .loading-spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 3px solid var(--gray-800);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      margin-top: var(--space-md);
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Footer */
    .site-footer {
      background: var(--gray-950);
      border-top: 1px solid var(--gray-800);
      padding: var(--space-2xl) var(--space-lg);
      margin-top: var(--space-3xl);
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
      text-align: center;
    }

    .footer-logo { width: 140px; height: auto; opacity: 0.8; }

    .footer-text { font-size: 0.875rem; color: var(--gray-500); max-width: 400px; }

    .footer-link { color: var(--gold); text-decoration: none; }
    .footer-link:hover { text-decoration: underline; }

    .footer-credit { font-size: 0.75rem; color: var(--gray-600); }

    /* Opponent Index Grid */
    .opponent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-md);
    }

    .opponent-card {
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      text-decoration: none;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .opponent-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold-dark);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .opponent-card-name {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--white);
    }

    .opponent-card-record {
      display: flex;
      gap: var(--space-lg);
    }

    .opponent-card-stat {
      text-align: center;
    }

    .opponent-card-num {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
    }

    .opponent-card-num.win { color: var(--win); }
    .opponent-card-num.draw { color: var(--gray-400); }
    .opponent-card-num.loss { color: var(--loss); }

    .opponent-card-label {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gray-500);
      margin-top: 2px;
    }

    .opponent-card-meta {
      font-size: 0.75rem;
      color: var(--gray-500);
    }

    .opponent-card-bar {
      height: 6px;
      border-radius: 3px;
      background: var(--gray-800);
      overflow: hidden;
      display: flex;
    }

    .opponent-card-bar-w { background: var(--win); }
    .opponent-card-bar-d { background: var(--gray-500); }
    .opponent-card-bar-l { background: var(--loss); }

    /* Jump to Opponents Link */
    .jump-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
      text-decoration: none;
      margin-bottom: var(--space-lg);
      transition: color 0.2s;
    }

    .jump-link:hover { color: var(--gold-light); }

    .jump-link::after {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      margin-bottom: 4px;
    }

    /* Index Total Counter */
    .index-count {
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gray-400);
      margin-bottom: var(--space-lg);
    }

    /* Player Search */
    .player-search {
      position: relative;
    }

    .player-search-input {
      font-family: var(--font-body);
      font-size: 0.8rem;
      background: var(--gray-800);
      color: var(--gray-100);
      border: 1px solid var(--gray-700);
      border-radius: var(--radius-md);
      padding: var(--space-xs) var(--space-md);
      width: 160px;
      outline: none;
      transition: border-color 0.2s, width 0.2s;
    }

    .player-search-input::placeholder { color: var(--gray-500); }
    .player-search-input:focus { border-color: var(--gold); width: 200px; }

    .player-search-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: var(--space-xs);
      width: 260px;
      background: var(--gray-900);
      border: 1px solid var(--gray-700);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 200;
      max-height: 360px;
      overflow-y: auto;
    }

    .player-search-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-sm) var(--space-md);
      text-decoration: none;
      color: var(--gray-200);
      transition: background 0.15s;
      gap: var(--space-sm);
    }

    .player-search-item:hover { background: var(--gray-800); }

    .player-search-name {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--white);
    }

    .player-search-meta {
      font-size: 0.7rem;
      color: var(--gray-500);
      white-space: nowrap;
    }

    .player-search-empty {
      padding: var(--space-sm) var(--space-md);
      font-size: 0.8rem;
      color: var(--gray-500);
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-content { flex-direction: column; gap: var(--space-sm); }

      .nav-section {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        gap: var(--space-md);
        padding-bottom: var(--space-xs);
      }

      .nav-section::-webkit-scrollbar { height: 0; display: none; }

      .nav-link { white-space: nowrap; font-size: 0.75rem; }

      .player-search-input { width: 120px; font-size: 0.75rem; }
      .player-search-input:focus { width: 150px; }

      .record-display { gap: var(--space-lg); }
      .record-number { font-size: 2rem; }
      .match-score-row { flex-wrap: wrap; }
      .score { font-size: 1.5rem; }
      .team-name { font-size: 1rem; }
      .stats-grid { grid-template-columns: 1fr; }
      .opponent-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-content">
      <a href="https://scarvesandspikes.com" class="logo-link">
        <img src="https://raw.githubusercontent.com/ATLPilgrim/scarvesandspikes-stats/main/logo_with_lockup_website.png" alt="Scarves and Spikes" class="logo-wordmark">
      </a>
      <nav class="nav-section">
        <a href="/" class="nav-link">Match History</a>
        <a href="/goalkeeper.html" class="nav-link">Goalkeepers</a>
        <a href="/players.html" class="nav-link">Players</a>
        <span class="nav-link nav-active" id="opponentsNavLabel">Opponents</span>
        <a href="/history.html" class="nav-link">History</a>
        <a href="/league.html" class="nav-link">Standings</a>
        <a href="#" id="randomOpponentLink" class="nav-link" style="display:none;">Random Opponent</a>
        <div class="player-search">
          <input type="text" class="player-search-input" placeholder="Search players...">
          <div class="player-search-dropdown"></div>
        </div>
      </nav>
    </div>
  </header>

  <!-- Hero (dynamic content) -->
  <section class="hero">
    <div class="hero-content">
      <p class="hero-subtitle" id="heroSubtitle">Head to Head History</p>
      <h1 class="hero-title" id="heroTitle">Pick an <span>Opponent</span></h1>
      <p class="hero-record" id="heroRecord"></p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="container">
    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <img src="/badge_community.png" alt="Scarves and Spikes" class="footer-logo">
      <p class="footer-text">
        Built by <a href="https://scarvesandspikes.com" class="footer-link">ScarvesAndSpikes.com</a> for Atlanta United supporters who love diving deep into the numbers.
      </p>
      <p class="footer-credit">Data provided by <a href="https://americansocceranalysis.com" class="footer-link" target="_blank" rel="noopener">American Soccer Analysis</a></p>
    </div>
  </footer>

  <script>
    // Get opponent from URL
    function getOpponentFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('team') || params.get('opponent');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const normalized = dateStr.replace(' UTC', 'Z').replace(' ', 'T');
      const date = new Date(normalized);
      if (isNaN(date.getTime())) return '-';
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatNumber(num) {
      return num ? num.toLocaleString() : '-';
    }

    // ── Index View (no team parameter) ──

    function renderOpponentIndex(opponents) {
      const cards = opponents.map(o => {
        const total = o.wins + o.draws + o.losses;
        const wPct = total > 0 ? (o.wins / total * 100) : 0;
        const dPct = total > 0 ? (o.draws / total * 100) : 0;
        const lPct = total > 0 ? (o.losses / total * 100) : 0;

        return `
          <a href="/opponent.html?team=${o.slug}" class="opponent-card">
            <div class="opponent-card-name">${o.name}</div>
            <div class="opponent-card-record">
              <div class="opponent-card-stat">
                <div class="opponent-card-num win">${o.wins}</div>
                <div class="opponent-card-label">W</div>
              </div>
              <div class="opponent-card-stat">
                <div class="opponent-card-num draw">${o.draws}</div>
                <div class="opponent-card-label">D</div>
              </div>
              <div class="opponent-card-stat">
                <div class="opponent-card-num loss">${o.losses}</div>
                <div class="opponent-card-label">L</div>
              </div>
            </div>
            <div class="opponent-card-bar">
              <div class="opponent-card-bar-w" style="width:${wPct}%"></div>
              <div class="opponent-card-bar-d" style="width:${dPct}%"></div>
              <div class="opponent-card-bar-l" style="width:${lPct}%"></div>
            </div>
            <div class="opponent-card-meta">${total} matches</div>
          </a>
        `;
      }).join('');

      return `
        <div class="index-count">${opponents.length} Opponents</div>
        <div class="opponent-grid">
          ${cards}
        </div>
      `;
    }

    async function loadOpponentIndex() {
      try {
        const response = await fetch('/api/opponents');
        const data = await response.json();

        if (!response.ok || !data.opponents) {
          throw new Error('Failed to load opponents');
        }

        document.getElementById('heroRecord').textContent =
          `${data.opponents.length} opponents faced since 2017`;
        document.getElementById('content').innerHTML = renderOpponentIndex(data.opponents);

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('content').innerHTML = `
          <div class="error-state">
            <p>Error loading opponents. <a href="/" style="color: var(--gold);">Return to Match History</a></p>
          </div>
        `;
      }
    }

    // ── Detail View (with team parameter) ──

    function renderStats(data) {
      const { stats, opponent, opponentAbbr } = data;

      return `
        <a href="#allOpponents" class="jump-link">View All Opponents</a>
        <div class="stats-grid">
          <div class="stats-card">
            <div class="stats-card-title">All-Time Record</div>
            <div class="record-display">
              <div class="record-item">
                <div class="record-number win">${stats.wins}</div>
                <div class="record-label">Wins</div>
              </div>
              <div class="record-item">
                <div class="record-number draw">${stats.draws}</div>
                <div class="record-label">Draws</div>
              </div>
              <div class="record-item">
                <div class="record-number loss">${stats.losses}</div>
                <div class="record-label">Losses</div>
              </div>
            </div>
            ${stats.currentStreak ? `
              <div style="text-align: center; margin-top: var(--space-md);">
                <span class="streak-badge ${stats.currentStreak.type}">
                  ${stats.currentStreak.count} ${stats.currentStreak.type === 'W' ? 'Win' : stats.currentStreak.type === 'L' ? 'Loss' : 'Draw'} Streak
                </span>
              </div>
            ` : ''}
          </div>

          <div class="stats-card">
            <div class="stats-card-title">Goals</div>
            <div class="stats-row">
              <span class="stats-label">Goals For</span>
              <span class="stats-value">${stats.goalsFor}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Goals Against</span>
              <span class="stats-value">${stats.goalsAgainst}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Goal Difference</span>
              <span class="stats-value ${stats.goalsFor - stats.goalsAgainst > 0 ? 'win' : stats.goalsFor - stats.goalsAgainst < 0 ? 'loss' : ''}">
                ${stats.goalsFor - stats.goalsAgainst > 0 ? '+' : ''}${stats.goalsFor - stats.goalsAgainst}
              </span>
            </div>
          </div>

          <div class="stats-card">
            <div class="stats-card-title">Expected Goals</div>
            <div class="stats-row">
              <span class="stats-label">xG For</span>
              <span class="stats-value">${stats.xgFor.toFixed(1)}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">xG Against</span>
              <span class="stats-value">${stats.xgAgainst.toFixed(1)}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">xG Difference</span>
              <span class="stats-value ${stats.xgFor - stats.xgAgainst > 0 ? 'win' : stats.xgFor - stats.xgAgainst < 0 ? 'loss' : ''}">
                ${stats.xgFor - stats.xgAgainst > 0 ? '+' : ''}${(stats.xgFor - stats.xgAgainst).toFixed(1)}
              </span>
            </div>
          </div>

          <div class="stats-card">
            <div class="stats-card-title">Home vs Away</div>
            <div class="stats-row">
              <span class="stats-label">Home Record</span>
              <span class="stats-value">${stats.homeWins}-${stats.homeDraws}-${stats.homeLosses}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Away Record</span>
              <span class="stats-value">${stats.awayWins}-${stats.awayDraws}-${stats.awayLosses}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Robberies / Smash+Grabs</span>
              <span class="stats-value">${stats.robberies} / ${stats.smashAndGrabs}</span>
            </div>
          </div>

          ${stats.biggestWin ? `
          <div class="stats-card">
            <div class="stats-card-title">Biggest Win</div>
            <div class="stats-row">
              <span class="stats-label">Score</span>
              <span class="stats-value win">${stats.biggestWin.score}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Date</span>
              <span class="stats-value">${formatDate(stats.biggestWin.date)}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Venue</span>
              <span class="stats-value">${stats.biggestWin.venue}</span>
            </div>
          </div>
          ` : ''}

          ${stats.biggestLoss ? `
          <div class="stats-card">
            <div class="stats-card-title">Biggest Loss</div>
            <div class="stats-row">
              <span class="stats-label">Score</span>
              <span class="stats-value loss">${stats.biggestLoss.score}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Date</span>
              <span class="stats-value">${formatDate(stats.biggestLoss.date)}</span>
            </div>
            <div class="stats-row">
              <span class="stats-label">Venue</span>
              <span class="stats-value">${stats.biggestLoss.venue}</span>
            </div>
          </div>
          ` : ''}
        </div>
      `;
    }

    function renderMatches(matches, opponentAbbr) {
      return `
        <div class="section-header">
          <h2 class="section-title">All Matches (${matches.length})</h2>
        </div>
        <div class="matches">
          ${matches.map(match => {
            const xgDiffClass = match.xgDiff > 0 ? 'positive' : match.xgDiff < 0 ? 'negative' : '';
            return `
              <article class="match-card ${match.result.toLowerCase()}" onclick="this.classList.toggle('expanded')">
                <div class="match-main">
                  <div class="match-header">
                    <div class="match-meta">
                      <span class="match-date">${formatDate(match.date)}</span>
                      <span class="match-competition">${match.isPlayoff ? 'MLS Cup Playoffs' : 'MLS Regular Season'} | ${match.season}</span>
                    </div>
                    <div class="match-badges">
                      ${match.isPlayoff ? '<span class="badge playoff">Playoff</span>' : ''}
                      ${match.xgVerdict === 'robbed' ? '<span class="badge robbed">Robbed</span>' : ''}
                      ${match.xgVerdict === 'smash-and-grab' ? '<span class="badge smash">Smash + Grab</span>' : ''}
                      <span class="badge result-${match.result.toLowerCase()}">${match.result}</span>
                    </div>
                  </div>

                  <div class="match-score-row">
                    <span class="team-name atlanta">Atlanta United</span>
                    <div class="score-display">
                      <span class="score">${match.atlScore}</span>
                      <span class="score-separator">-</span>
                      <span class="score">${match.oppScore}</span>
                    </div>
                    <span class="team-name opponent">${match.opponent}</span>
                    <span class="venue-indicator">${match.isHome ? 'HOME' : 'AWAY'}</span>
                  </div>

                  <div class="match-xg">
                    <div class="xg-item">
                      <span class="xg-label">ATL xG</span>
                      <span class="xg-value">${match.atlXg !== null ? match.atlXg : '-'}</span>
                    </div>
                    <div class="xg-item">
                      <span class="xg-label">${opponentAbbr} xG</span>
                      <span class="xg-value">${match.oppXg !== null ? match.oppXg : '-'}</span>
                    </div>
                    <div class="xg-item">
                      <span class="xg-label">xG Diff</span>
                      <span class="xg-value ${xgDiffClass}">${match.xgDiff !== null ? (match.xgDiff > 0 ? '+' : '') + match.xgDiff : '-'}</span>
                    </div>
                  </div>
                  <div class="expand-hint"><span>Details</span></div>
                </div>

                <div class="match-details">
                  <div class="details-grid">
                    <div class="detail-item">
                      <span class="detail-label">Attendance</span>
                      <span class="detail-value">${formatNumber(match.attendance)}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">Stadium</span>
                      <span class="detail-value">${match.stadium || '-'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">ATL Manager</span>
                      <span class="detail-value">${match.atlManager || '-'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">${opponentAbbr} Manager</span>
                      <span class="detail-value">${match.oppManager || '-'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">Referee</span>
                      <span class="detail-value">${match.referee || '-'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">Season</span>
                      <span class="detail-value">${match.season}</span>
                    </div>
                  </div>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderOpponentNav(allOpponents, currentSlug) {
      return `
        <div class="opponent-nav" id="allOpponents">
          <div class="opponent-nav-title">All Opponents</div>
          <div class="opponent-list">
            ${allOpponents.map(o => `
              <a href="/opponent.html?team=${o.slug}" class="opponent-link ${o.slug === currentSlug ? 'active' : ''}">${o.name}</a>
            `).join('')}
          </div>
        </div>
      `;
    }

    async function loadOpponentDetail(opponent) {
      // Switch hero to detail mode
      document.getElementById('heroSubtitle').textContent = 'Head to Head History';
      document.getElementById('heroTitle').innerHTML = 'Atlanta United vs <span id="opponentName">...</span>';

      // Switch nav: Opponents becomes a link, not active
      const navLabel = document.getElementById('opponentsNavLabel');
      const link = document.createElement('a');
      link.href = '/opponent.html';
      link.className = 'nav-link';
      link.textContent = 'Opponents';
      navLabel.parentNode.replaceChild(link, navLabel);

      // Show random opponent link
      document.getElementById('randomOpponentLink').style.display = '';

      try {
        const response = await fetch(`/api/opponent?opponent=${encodeURIComponent(opponent)}`);
        const data = await response.json();

        if (!response.ok) {
          if (data.availableOpponents) {
            document.getElementById('opponentName').textContent = 'Unknown';
            document.getElementById('content').innerHTML = `
              <div class="error-state">
                <p>Opponent "${opponent}" not found.</p>
              </div>
              ${renderOpponentNav(data.availableOpponents, '')}
            `;
          } else {
            throw new Error(data.error || 'Failed to load data');
          }
          return;
        }

        // Update page title and meta
        document.title = `Atlanta United vs ${data.opponent} - Head to Head History | ScarvesAndSpikes.com`;
        document.querySelector('meta[name="description"]').content =
          `Complete head-to-head history: Atlanta United is ${data.stats.wins}-${data.stats.draws}-${data.stats.losses} against ${data.opponent} in MLS play. View all ${data.stats.totalMatches} matches with xG analytics.`;

        // Update hero
        document.getElementById('opponentName').textContent = data.opponent;
        document.getElementById('heroRecord').textContent =
          `${data.stats.totalMatches} Matches | ${data.stats.wins}W - ${data.stats.draws}D - ${data.stats.losses}L`;

        // Render content
        document.getElementById('content').innerHTML =
          renderStats(data) +
          renderMatches(data.matches, data.opponentAbbr) +
          renderOpponentNav(data.allOpponents, data.slug);

        // Wire up random opponent link
        const currentSlug = data.slug;
        const otherOpponents = data.allOpponents.filter(o => o.slug !== currentSlug);
        document.getElementById('randomOpponentLink').addEventListener('click', function(e) {
          e.preventDefault();
          if (otherOpponents.length === 0) return;
          const random = otherOpponents[Math.floor(Math.random() * otherOpponents.length)];
          window.location.href = '/opponent.html?team=' + encodeURIComponent(random.slug);
        });

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('content').innerHTML = `
          <div class="error-state">
            <p>Error loading data. <a href="/" style="color: var(--gold);">Return to Match History</a></p>
          </div>
        `;
      }
    }

    // ── Route ──

    const opponent = getOpponentFromURL();
    if (opponent) {
      loadOpponentDetail(opponent);
    } else {
      document.title = 'Atlanta United Opponents - Head to Head History | ScarvesAndSpikes.com';
      loadOpponentIndex();
    }
  </script>
  <script src="/search.js"></script>
</body>
</html>
