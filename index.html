<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlanta United xG History | ScarvesAndSpikes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: #0a0a0a;
            color: #e8e8e8;
            line-height: 1.6;
        }
        
        .header {
            background: linear-gradient(180deg, #80000A 0%, #5a0007 100%);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 3px solid #A19060;
        }
        
        .header h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #ccb872;
            font-size: 0.95rem;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .status-bar {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px 20px;
            margin-bottom: 30px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.9rem;
            color: #888;
        }
        
        .status-bar.loading {
            border-left: 3px solid #A19060;
        }
        
        .status-bar.success {
            border-left: 3px solid #4a9;
        }
        
        .status-bar.error {
            border-left: 3px solid #a44;
        }
        
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .match-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 20px;
            transition: border-color 0.2s;
        }
        
        .match-card:hover {
            border-color: #444;
        }
        
        .match-date {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .match-teams {
            font-size: 1.2rem;
            margin-bottom: 12px;
        }
        
        .match-score {
            color: #fff;
            font-weight: 600;
        }
        
        .atl-name {
            color: #c8a870;
        }
        
        .match-xg {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.9rem;
        }
        
        .xg-item {
            color: #999;
        }
        
        .xg-value {
            color: #ccb872;
            font-weight: 600;
        }
        
        .xg-diff {
            margin-left: auto;
        }
        
        .xg-diff.positive {
            color: #5a9;
        }
        
        .xg-diff.negative {
            color: #a55;
        }
        
        .result-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .result-badge.win {
            background: #1a3d1a;
            color: #5a9;
        }
        
        .result-badge.loss {
            background: #3d1a1a;
            color: #a55;
        }
        
        .result-badge.draw {
            background: #3d3d1a;
            color: #aa5;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Atlanta United xG History</h1>
        <p>Expected goals data for every match since 2017</p>
    </div>
    
    <div class="container">
        <div id="status" class="status-bar loading">
            Loading match data...
        </div>
        
        <div id="matches" class="match-list"></div>
    </div>

    <script>
        async function fetchMatches() {
            const statusEl = document.getElementById('status');
            const matchesEl = document.getElementById('matches');
            
            try {
                const response = await fetch('/api/matches');
                
                if (!response.ok) {
                    throw new Error('API returned ' + response.status);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                statusEl.className = 'status-bar success';
                statusEl.textContent = 'Loaded ' + data.length + ' matches from 2024 season';
                
                // Render matches
                data.forEach(match => {
                    const isHome = match.home_abbrev === 'ATL';
                    const atlGoals = isHome ? match.home_goals : match.away_goals;
                    const oppGoals = isHome ? match.away_goals : match.home_goals;
                    const atlXg = isHome ? match.home_xg : match.away_xg;
                    const oppXg = isHome ? match.away_xg : match.home_xg;
                    const opponent = isHome ? match.away_team : match.home_team;
                    const oppAbbrev = isHome ? match.away_abbrev : match.home_abbrev;
                    const venue = isHome ? 'vs' : 'at';
                    
                    const xgDiff = (atlXg - oppXg).toFixed(2);
                    const xgDiffClass = xgDiff > 0 ? 'positive' : xgDiff < 0 ? 'negative' : '';
                    const xgDiffSign = xgDiff > 0 ? '+' : '';
                    
                    let result, resultClass;
                    if (atlGoals > oppGoals) {
                        result = 'W';
                        resultClass = 'win';
                    } else if (atlGoals < oppGoals) {
                        result = 'L';
                        resultClass = 'loss';
                    } else {
                        result = 'D';
                        resultClass = 'draw';
                    }
                    
                    const dateStr = new Date(match.date.replace(' UTC', 'Z')).toLocaleDateString('en-US', {
                        weekday: 'short',
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });
                    
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-date">${dateStr}</div>
                        <div class="match-teams">
                            <span class="atl-name">Atlanta United</span> 
                            <span class="match-score">${atlGoals}</span> 
                            ${venue} 
                            ${opponent} 
                            <span class="match-score">${oppGoals}</span>
                            <span class="result-badge ${resultClass}">${result}</span>
                        </div>
                        <div class="match-xg">
                            <div class="xg-item">ATL xG: <span class="xg-value">${atlXg.toFixed(2)}</span></div>
                            <div class="xg-item">${oppAbbrev} xG: <span class="xg-value">${oppXg.toFixed(2)}</span></div>
                            <div class="xg-item xg-diff ${xgDiffClass}">xG Diff: ${xgDiffSign}${xgDiff}</div>
                        </div>
                    `;
                    
                    matchesEl.appendChild(card);
                });
                
            } catch (error) {
                statusEl.className = 'status-bar error';
                statusEl.textContent = 'Error loading data: ' + error.message;
                console.error('Fetch error:', error);
            }
        }
        
        fetchMatches();
    </script>
</body>
</html>
