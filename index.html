<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlanta United Stats | ScarvesAndSpikes.com</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #80000a;
    }

    h1 {
      color: #c9a227;
      font-size: 2rem;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #888;
      font-size: 0.9rem;
    }

    /* Summary Stats */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
      padding: 20px;
      background: #242424;
      border-radius: 8px;
    }

    .stat-box {
      text-align: center;
      padding: 10px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #c9a227;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      padding: 15px;
      background: #242424;
      border-radius: 8px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .filter-group label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
    }

    .filter-group select {
      padding: 8px 12px;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .filter-group select:hover {
      border-color: #c9a227;
    }

    /* Match Cards */
    .matches {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background: #242424;
      border-radius: 8px;
      padding: 15px 20px;
      border-left: 4px solid #444;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .match-card:hover {
      background: #2a2a2a;
    }

    .match-card.win {
      border-left-color: #4caf50;
    }

    .match-card.loss {
      border-left-color: #f44336;
    }

    .match-card.draw {
      border-left-color: #888;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .match-date {
      font-size: 0.8rem;
      color: #888;
    }

    .match-badges {
      display: flex;
      gap: 8px;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge.result-w {
      background: #4caf50;
      color: #fff;
    }

    .badge.result-l {
      background: #f44336;
      color: #fff;
    }

    .badge.result-d {
      background: #888;
      color: #fff;
    }

    .badge.playoff {
      background: #9c27b0;
      color: #fff;
    }

    .badge.robbed {
      background: #ff9800;
      color: #000;
    }

    .badge.smash {
      background: #00bcd4;
      color: #000;
    }

    .match-score {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .team-name {
      font-size: 1.1rem;
      font-weight: 500;
    }

    .team-name.atlanta {
      color: #c9a227;
    }

    .score {
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
    }

    .venue-indicator {
      font-size: 0.8rem;
      color: #888;
      margin-left: 5px;
    }

    .match-xg {
      display: flex;
      gap: 20px;
      font-size: 0.85rem;
      color: #888;
    }

    .xg-item {
      display: flex;
      gap: 5px;
    }

    .xg-label {
      color: #666;
    }

    .xg-value {
      color: #c9a227;
      font-weight: 500;
    }

    .xg-value.positive {
      color: #4caf50;
    }

    .xg-value.negative {
      color: #f44336;
    }

    /* Expanded Match Details */
    .match-details {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #333;
    }

    .match-card.expanded .match-details {
      display: block;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-label {
      font-size: 0.7rem;
      color: #666;
      text-transform: uppercase;
    }

    .detail-value {
      font-size: 0.9rem;
      color: #e0e0e0;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 50px;
      color: #888;
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #c9a227;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Match Count */
    .match-count {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 15px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .match-score {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }

      .match-xg {
        flex-direction: column;
        gap: 5px;
      }

      .summary {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    /* Head to Head Summary */
    .h2h-summary {
      display: none;
      background: #242424;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    .h2h-summary.visible {
      display: block;
    }

    .h2h-title {
      font-size: 1.2rem;
      color: #c9a227;
      margin-bottom: 15px;
      text-align: center;
    }

    .h2h-stats {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 15px;
      align-items: center;
      text-align: center;
    }

    .h2h-team {
      font-weight: 600;
    }

    .h2h-team.atlanta {
      color: #c9a227;
    }

    .h2h-vs {
      color: #666;
      font-size: 0.9rem;
    }

    .h2h-record {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 20px 0;
      padding: 15px;
      background: #1a1a1a;
      border-radius: 6px;
    }

    .h2h-record-item {
      text-align: center;
    }

    .h2h-record-value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .h2h-record-value.wins {
      color: #4caf50;
    }

    .h2h-record-value.draws {
      color: #888;
    }

    .h2h-record-value.losses {
      color: #f44336;
    }

    .h2h-record-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
    }

    .h2h-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .h2h-detail-item {
      text-align: center;
      padding: 10px;
      background: #1a1a1a;
      border-radius: 6px;
    }

    .h2h-detail-value {
      font-size: 1.3rem;
      font-weight: bold;
      color: #c9a227;
    }

    .h2h-detail-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Atlanta United Match History</h1>
      <p class="subtitle">Expected Goals (xG) Analysis | 2017-Present</p>
    </header>

    <div id="summary" class="summary" style="display: none;"></div>

    <div class="filters">
      <div class="filter-group">
        <label>Season</label>
        <select id="seasonFilter">
          <option value="all">All Seasons</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Result</label>
        <select id="resultFilter">
          <option value="all">All Results</option>
          <option value="W">Wins</option>
          <option value="D">Draws</option>
          <option value="L">Losses</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Venue</label>
        <select id="venueFilter">
          <option value="all">Home & Away</option>
          <option value="home">Home Only</option>
          <option value="away">Away Only</option>
        </select>
      </div>
      <div class="filter-group">
        <label>xG Verdict</label>
        <select id="verdictFilter">
          <option value="all">All Matches</option>
          <option value="robbed">Robberies</option>
          <option value="smash-and-grab">Smash & Grabs</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Competition</label>
        <select id="compFilter">
          <option value="all">All Matches</option>
          <option value="regular">Regular Season</option>
          <option value="playoff">Playoffs</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Opponent</label>
        <select id="opponentFilter">
          <option value="all">All Opponents</option>
        </select>
      </div>
    </div>

    <div id="h2hSummary" class="h2h-summary"></div>
    <div id="matchCount" class="match-count"></div>

    <div id="matches" class="matches">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading match data...</p>
      </div>
    </div>
  </div>

  <script>
    let allMatches = [];
    let summaryData = {};
    let loadedSeasons = new Set();
    let availableSeasons = [];

    // Format date for display
    function formatDate(dateStr) {
      // Remove " UTC" suffix that breaks Date parsing in some browsers
      const cleanedDate = dateStr.replace(' UTC', 'Z').replace(' ', 'T');
      const date = new Date(cleanedDate);
      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      return date.toLocaleDateString('en-US', options);
    }

    // Format attendance with commas
    function formatNumber(num) {
      if (!num) return '-';
      return num.toLocaleString();
    }

    // Render summary stats
    function renderSummary(summary) {
      const container = document.getElementById('summary');
      container.style.display = 'grid';
      container.innerHTML = `
        <div class="stat-box">
          <div class="stat-value">${summary.totalMatches}</div>
          <div class="stat-label">Matches</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${summary.wins}-${summary.draws}-${summary.losses}</div>
          <div class="stat-label">W-D-L</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${summary.goalsFor}</div>
          <div class="stat-label">Goals For</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${summary.goalsAgainst}</div>
          <div class="stat-label">Goals Against</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${summary.totalXgFor.toFixed(1)}</div>
          <div class="stat-label">Total xG For</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${summary.totalXgAgainst.toFixed(1)}</div>
          <div class="stat-label">Total xG Against</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${summary.robberies}</div>
          <div class="stat-label">Robberies</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${summary.smashAndGrabs}</div>
          <div class="stat-label">Smash & Grabs</div>
        </div>
      `;
    }

    // Populate season filter dropdown
    function populateSeasonFilter(seasons, currentSeason) {
      const select = document.getElementById('seasonFilter');
      select.innerHTML = '<option value="all">All Seasons</option>';
      seasons.forEach(season => {
        const option = document.createElement('option');
        option.value = season;
        option.textContent = season;
        select.appendChild(option);
      });
      // Default to current season
      select.value = currentSeason;
    }

    // Populate opponent filter dropdown
    function populateOpponentFilter(matches) {
      const opponents = [...new Set(matches.map(m => m.opponent))].sort();
      const select = document.getElementById('opponentFilter');
      // Keep "All Opponents" option, clear the rest
      select.innerHTML = '<option value="all">All Opponents</option>';
      opponents.forEach(opponent => {
        const option = document.createElement('option');
        option.value = opponent;
        option.textContent = opponent;
        select.appendChild(option);
      });
    }

    // Render match cards
    function renderMatches(matches) {
      const container = document.getElementById('matches');
      const countEl = document.getElementById('matchCount');
      
      countEl.textContent = `Showing ${matches.length} match${matches.length !== 1 ? 'es' : ''}`;

      if (matches.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #888; padding: 30px;">No matches found matching your filters.</p>';
        return;
      }

      container.innerHTML = matches.map(match => {
        const xgDiffClass = match.xgDiff > 0 ? 'positive' : match.xgDiff < 0 ? 'negative' : '';
        const venueText = match.isHome ? 'vs' : 'at';
        
        return `
          <div class="match-card ${match.result.toLowerCase()}" onclick="this.classList.toggle('expanded')">
            <div class="match-header">
              <span class="match-date">${formatDate(match.date)} | Matchday ${match.matchday || '-'}</span>
              <div class="match-badges">
                ${match.isPlayoff ? '<span class="badge playoff">Playoff</span>' : ''}
                ${match.xgVerdict === 'robbed' ? '<span class="badge robbed">Robbed</span>' : ''}
                ${match.xgVerdict === 'smash-and-grab' ? '<span class="badge smash">Smash & Grab</span>' : ''}
                <span class="badge result-${match.result.toLowerCase()}">${match.result}</span>
              </div>
            </div>
            
            <div class="match-score">
              <span class="team-name atlanta">Atlanta United</span>
              <span class="score">${match.atlScore}</span>
              <span class="venue-indicator">${venueText}</span>
              <span class="score">${match.oppScore}</span>
              <span class="team-name">${match.opponent}</span>
            </div>
            
            <div class="match-xg">
              <div class="xg-item">
                <span class="xg-label">ATL xG:</span>
                <span class="xg-value">${match.atlXg !== null ? match.atlXg : '-'}</span>
              </div>
              <div class="xg-item">
                <span class="xg-label">${match.opponentAbbr} xG:</span>
                <span class="xg-value">${match.oppXg !== null ? match.oppXg : '-'}</span>
              </div>
              <div class="xg-item">
                <span class="xg-label">xG Diff:</span>
                <span class="xg-value ${xgDiffClass}">${match.xgDiff !== null ? (match.xgDiff > 0 ? '+' : '') + match.xgDiff : '-'}</span>
              </div>
            </div>

            <div class="match-details">
              <div class="details-grid">
                <div class="detail-item">
                  <span class="detail-label">Attendance</span>
                  <span class="detail-value">${formatNumber(match.attendance)}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Stadium</span>
                  <span class="detail-value">${match.stadium || '-'}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">ATL Manager</span>
                  <span class="detail-value">${match.atlManager || '-'}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">${match.opponentAbbr} Manager</span>
                  <span class="detail-value">${match.oppManager || '-'}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Referee</span>
                  <span class="detail-value">${match.referee || '-'}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Match Length</span>
                  <span class="detail-value">${match.expandedMinutes ? match.expandedMinutes + ' min' : '-'}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">ATL xPoints</span>
                  <span class="detail-value">${match.atlXpoints !== null ? match.atlXpoints : '-'}</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">Season</span>
                  <span class="detail-value">${match.season}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

// Render head-to-head summary for selected opponent
    function renderH2H(matches, opponentName) {
      const container = document.getElementById('h2hSummary');
      
      if (!opponentName || opponentName === 'all' || matches.length === 0) {
        container.classList.remove('visible');
        return;
      }

      const wins = matches.filter(m => m.result === 'W').length;
      const draws = matches.filter(m => m.result === 'D').length;
      const losses = matches.filter(m => m.result === 'L').length;
      const goalsFor = matches.reduce((sum, m) => sum + (m.atlScore || 0), 0);
      const goalsAgainst = matches.reduce((sum, m) => sum + (m.oppScore || 0), 0);
      const xgFor = matches.reduce((sum, m) => sum + (m.atlXg || 0), 0);
      const xgAgainst = matches.reduce((sum, m) => sum + (m.oppXg || 0), 0);
      const homeWins = matches.filter(m => m.isHome && m.result === 'W').length;
      const awayWins = matches.filter(m => !m.isHome && m.result === 'W').length;
      const robberies = matches.filter(m => m.xgVerdict === 'robbed').length;
      const smashGrabs = matches.filter(m => m.xgVerdict === 'smash-and-grab').length;

      container.innerHTML = `
        <div class="h2h-title">Head-to-Head vs ${opponentName}</div>
        <div class="h2h-record">
          <div class="h2h-record-item">
            <div class="h2h-record-value wins">${wins}</div>
            <div class="h2h-record-label">Wins</div>
          </div>
          <div class="h2h-record-item">
            <div class="h2h-record-value draws">${draws}</div>
            <div class="h2h-record-label">Draws</div>
          </div>
          <div class="h2h-record-item">
            <div class="h2h-record-value losses">${losses}</div>
            <div class="h2h-record-label">Losses</div>
          </div>
        </div>
        <div class="h2h-details">
          <div class="h2h-detail-item">
            <div class="h2h-detail-value">${goalsFor}-${goalsAgainst}</div>
            <div class="h2h-detail-label">Goals (F-A)</div>
          </div>
          <div class="h2h-detail-item">
            <div class="h2h-detail-value">${xgFor.toFixed(1)}-${xgAgainst.toFixed(1)}</div>
            <div class="h2h-detail-label">xG (F-A)</div>
          </div>
          <div class="h2h-detail-item">
            <div class="h2h-detail-value">${homeWins}-${awayWins}</div>
            <div class="h2h-detail-label">Wins (H-A)</div>
          </div>
          <div class="h2h-detail-item">
            <div class="h2h-detail-value">${robberies}</div>
            <div class="h2h-detail-label">Robberies</div>
          </div>
          <div class="h2h-detail-item">
            <div class="h2h-detail-value">${smashGrabs}</div>
            <div class="h2h-detail-label">Smash & Grabs</div>
          </div>
          <div class="h2h-detail-item">
            <div class="h2h-detail-value">${matches.length}</div>
            <div class="h2h-detail-label">Total Matches</div>
          </div>
        </div>
      `;
      
      container.classList.add('visible');
    }
    
// Update summary stats for given matches
    function updateSummary(matches) {
      const summary = {
        totalMatches: matches.length,
        wins: matches.filter(m => m.result === 'W').length,
        draws: matches.filter(m => m.result === 'D').length,
        losses: matches.filter(m => m.result === 'L').length,
        goalsFor: matches.reduce((sum, m) => sum + (m.atlScore || 0), 0),
        goalsAgainst: matches.reduce((sum, m) => sum + (m.oppScore || 0), 0),
        totalXgFor: matches.reduce((sum, m) => sum + (m.atlXg || 0), 0),
        totalXgAgainst: matches.reduce((sum, m) => sum + (m.oppXg || 0), 0),
        robberies: matches.filter(m => m.xgVerdict === 'robbed').length,
        smashAndGrabs: matches.filter(m => m.xgVerdict === 'smash-and-grab').length
      };
      renderSummary(summary);
    }
    
    // Apply filters
    async function applyFilters() {
      const season = document.getElementById('seasonFilter').value;
      const result = document.getElementById('resultFilter').value;
      const venue = document.getElementById('venueFilter').value;
      const verdict = document.getElementById('verdictFilter').value;
      const comp = document.getElementById('compFilter').value;

      // Check if we need to load more data
      if (season === 'all') {
        // Load all seasons we haven't loaded yet
        const seasonsToLoad = availableSeasons.filter(s => !loadedSeasons.has(String(s)));
        if (seasonsToLoad.length > 0) {
          document.getElementById('matches').innerHTML = `
            <div class="loading">
              <div class="loading-spinner"></div>
              <p>Loading all seasons...</p>
            </div>
          `;
          const response = await fetch('/api/matches?season=all');
          const data = await response.json();
          allMatches = data.matches;
          summaryData = data.summary;
          availableSeasons.forEach(s => loadedSeasons.add(String(s)));
        renderSummary(summaryData);
        populateOpponentFilter(allMatches);
      }
      } else if (!loadedSeasons.has(String(season))) {
        // Load the specific season
        document.getElementById('matches').innerHTML = `
          <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading ${season} season...</p>
          </div>
        `;
        const response = await fetch(`/api/matches?season=${season}`);
        const data = await response.json();
        // Add new matches to our collection
        allMatches = [...allMatches, ...data.matches];
        loadedSeasons.add(String(season));
        populateOpponentFilter(allMatches);
      }

      // Filter the matches we have
      let filtered = allMatches;

      if (season !== 'all') {
        filtered = filtered.filter(m => String(m.season) === String(season));
      }
      if (result !== 'all') {
        filtered = filtered.filter(m => m.result === result);
      }
      if (venue === 'home') {
        filtered = filtered.filter(m => m.isHome);
      } else if (venue === 'away') {
        filtered = filtered.filter(m => !m.isHome);
      }
      if (verdict !== 'all') {
        filtered = filtered.filter(m => m.xgVerdict === verdict);
      }
      const opponent = document.getElementById('opponentFilter').value;
      if (opponent !== 'all') {
        filtered = filtered.filter(m => m.opponent === opponent);
      }
      if (comp === 'regular') {
        filtered = filtered.filter(m => !m.isPlayoff);
      } else if (comp === 'playoff') {
        filtered = filtered.filter(m => m.isPlayoff);
      }

      // Sort by date descending
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      // Update summary for filtered matches
      updateSummary(filtered);

      // Show H2H if opponent is selected
      renderH2H(filtered, opponent);

      renderMatches(filtered);
    }

    // Initialize
    async function init() {
      try {
        // Load current season by default (fastest)
        const response = await fetch('/api/matches');
        const data = await response.json();
        
        allMatches = data.matches;
        summaryData = data.summary;
        availableSeasons = data.availableSeasons;
        loadedSeasons.add(String(data.loadedSeason));

        renderSummary(summaryData);
        populateSeasonFilter(availableSeasons, data.loadedSeason);
        populateOpponentFilter(allMatches);
        renderMatches(allMatches);

        // Add filter event listeners
        document.getElementById('seasonFilter').addEventListener('change', applyFilters);
        document.getElementById('resultFilter').addEventListener('change', applyFilters);
        document.getElementById('venueFilter').addEventListener('change', applyFilters);
        document.getElementById('verdictFilter').addEventListener('change', applyFilters);
        document.getElementById('compFilter').addEventListener('change', applyFilters);
        document.getElementById('opponentFilter').addEventListener('change', applyFilters);

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('matches').innerHTML = `
          <p style="text-align: center; color: #f44336; padding: 30px;">
            Error loading match data. Please try refreshing the page.
          </p>
        `;
      }
    }
    init();
  </script>
</body>
</html>
