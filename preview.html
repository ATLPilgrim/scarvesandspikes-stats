<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/badge_community.png">
  <title>Match Preview Generator | ScarvesAndSpikes.com</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --burgundy: #80000a;
    --burgundy-dark: #5c0007;
    --gold: #c9a227;
    --gold-dark: #9a7a1a;
    --black: #0a0a0a;
    --gray-950: #121212;
    --gray-900: #1a1a1a;
    --gray-800: #242424;
    --gray-700: #333333;
    --gray-600: #4a4a4a;
    --gray-500: #6b6b6b;
    --gray-400: #888888;
    --gray-300: #aaaaaa;
    --gray-200: #cccccc;
    --gray-100: #e0e0e0;
    --white: #f5f5f5;
    --win: #2e7d32;
    --loss: #c62828;
    --draw: #666666;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Source Sans 3', sans-serif;
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;
    --space-xl: 24px;
    --radius: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--black);
    color: var(--gray-100);
    min-height: 100vh;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: var(--space-xl);
  }

  h1 {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: var(--space-xl);
    text-align: center;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-lg);
    margin-bottom: var(--space-xl);
    background: var(--gray-900);
    padding: var(--space-xl);
    border-radius: var(--radius);
    border: 1px solid var(--gray-800);
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
  }

  .control-group.full-width {
    grid-column: 1 / -1;
  }

  label {
    font-family: var(--font-display);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  select, input[type="date"] {
    font-family: var(--font-body);
    font-size: 0.9rem;
    padding: 10px 12px;
    background: var(--gray-800);
    color: var(--gray-100);
    border: 1px solid var(--gray-700);
    border-radius: var(--radius);
    appearance: none;
    cursor: pointer;
  }

  select:focus, input[type="date"]:focus {
    outline: none;
    border-color: var(--gold);
  }

  .venue-toggle {
    display: flex;
    gap: 0;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--gray-700);
  }

  .venue-toggle button {
    flex: 1;
    padding: 10px 12px;
    font-family: var(--font-display);
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    background: var(--gray-800);
    color: var(--gray-400);
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  .venue-toggle button.active {
    background: var(--burgundy);
    color: var(--gold);
  }

  .actions {
    display: flex;
    gap: var(--space-md);
    margin-bottom: var(--space-xl);
    justify-content: center;
  }

  .btn {
    font-family: var(--font-display);
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: uppercase;
    padding: 12px 28px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--burgundy);
    color: var(--gold);
  }

  .btn-primary:hover { background: var(--burgundy-dark); }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-download {
    background: var(--gold-dark);
    color: var(--black);
    display: none;
  }

  .btn-download:hover { background: var(--gold); }

  .preview-area {
    text-align: center;
    margin-bottom: var(--space-xl);
  }

  .preview-area canvas {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius);
    border: 1px solid var(--gray-800);
  }

  .status {
    text-align: center;
    font-size: 0.85rem;
    color: var(--gray-500);
    font-style: italic;
    padding: var(--space-xl);
  }

  .status.error { color: var(--loss); }

  @media (max-width: 600px) {
    .controls {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Match Preview Generator</h1>

  <div class="controls">
    <div class="control-group">
      <label for="opponentSelect">Opponent</label>
      <select id="opponentSelect">
        <option value="">Loading opponents...</option>
      </select>
    </div>

    <div class="control-group">
      <label for="matchDate">Match Date</label>
      <input type="date" id="matchDate">
    </div>

    <div class="control-group">
      <label>Venue</label>
      <div class="venue-toggle">
        <button id="venueHome" class="active" onclick="setVenue('home')">Home</button>
        <button id="venueAway" onclick="setVenue('away')">Away</button>
      </div>
    </div>

    <div class="control-group">
      <label for="competitionSelect">Competition</label>
      <select id="competitionSelect">
        <option value="MLS Regular Season">MLS Regular Season</option>
        <option value="MLS Playoffs">MLS Playoffs</option>
        <option value="US Open Cup">US Open Cup</option>
        <option value="Leagues Cup">Leagues Cup</option>
        <option value="CONCACAF Champions Cup">CONCACAF Champions Cup</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="generateBtn" onclick="generate()">Generate Preview</button>
    <button class="btn btn-download" id="downloadBtn" onclick="download()">Download PNG</button>
  </div>

  <div class="preview-area">
    <div class="status" id="status">Select an opponent and date to generate a match preview graphic.</div>
    <canvas id="previewCanvas" width="1080" height="1500" style="display:none;"></canvas>
  </div>
</div>

<script>
  // ── State ──
  let venue = 'home';
  let opponents = [];
  let generatedBlob = null;

  // ── Helpers ──
  const normalizeTeamNameForLogo = (name) => {
    return name.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/\s+/g, '-')
      .replace(/[^a-z0-9-]/g, '')
      .replace(/^fc-/, '')
      .replace(/-fc$/, '')
      .replace(/-sc$/, '')
      .replace(/^real-/, '')
      .replace(/-cf$/, '');
  };

  function loadImage(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function formatDateNice(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }

  function setVenue(v) {
    venue = v;
    document.getElementById('venueHome').classList.toggle('active', v === 'home');
    document.getElementById('venueAway').classList.toggle('active', v === 'away');
  }

  function setStatus(msg, isError) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (isError ? ' error' : '');
    el.style.display = 'block';
  }

  // ── Init: load opponents ──
  async function init() {
    try {
      const res = await fetch('/api/opponents');
      const data = await res.json();
      opponents = data.opponents.sort((a, b) => a.name.localeCompare(b.name));

      const select = document.getElementById('opponentSelect');
      select.innerHTML = '<option value="">Select opponent...</option>';
      opponents.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.slug;
        opt.textContent = o.name;
        select.appendChild(opt);
      });

      // Default date to today
      const today = new Date();
      document.getElementById('matchDate').value = today.toISOString().split('T')[0];
    } catch (e) {
      setStatus('Failed to load opponents.', true);
    }
  }

  // ── Fetch all data needed ──
  async function fetchPreviewData(oppSlug) {
    const season = new Date().getFullYear();

    const [oppRes, matchesRes, insightsRes, leagueRes] = await Promise.all([
      fetch(`/api/opponent?opponent=${encodeURIComponent(oppSlug)}`).then(r => r.json()),
      fetch(`/api/matches?season=${season}`).then(r => r.json()),
      fetch(`/api/insights?season=${season}`).then(r => r.json()).catch(() => null),
      fetch(`/api/insights?season=${season}&type=league`).then(r => r.json()).catch(() => null)
    ]);

    return { opponent: oppRes, matches: matchesRes, insights: insightsRes, league: leagueRes };
  }

  // ── Canvas generation ──
  async function generate() {
    const oppSlug = document.getElementById('opponentSelect').value;
    const matchDate = document.getElementById('matchDate').value;
    const competition = document.getElementById('competitionSelect').value;

    if (!oppSlug) { setStatus('Please select an opponent.', true); return; }
    if (!matchDate) { setStatus('Please select a match date.', true); return; }

    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.textContent = 'Generating...';
    setStatus('Fetching data...');
    document.getElementById('previewCanvas').style.display = 'none';
    document.getElementById('downloadBtn').style.display = 'none';

    try {
      const data = await fetchPreviewData(oppSlug);
      setStatus('Rendering graphic...');
      await renderPreview(data, matchDate, competition);
      document.getElementById('previewCanvas').style.display = 'block';
      document.getElementById('downloadBtn').style.display = 'inline-block';
      document.getElementById('status').style.display = 'none';
    } catch (e) {
      console.error(e);
      setStatus('Error generating preview: ' + e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate Preview';
    }
  }

  async function renderPreview(data, matchDate, competition) {
    const W = 1080, H = 1500;
    const canvas = document.getElementById('previewCanvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    const pad = 60; // horizontal padding

    // Colors
    const burgundy = '#80000a';
    const gold = '#c9a227';
    const gray950 = '#121212';
    const gray800 = '#242424';
    const gray700 = '#333333';
    const gray400 = '#888888';
    const gray100 = '#e0e0e0';
    const white = '#ffffff';
    const winColor = '#2e7d32';
    const lossColor = '#c62828';
    const drawColor = '#666666';

    const display = 'Oswald';
    const body = 'Source Sans 3';

    // ── Helpers ──
    function drawDivider(y) {
      ctx.strokeStyle = gray700;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad, y);
      ctx.lineTo(W - pad, y);
      ctx.stroke();
    }

    function drawSectionTitle(text, y) {
      ctx.fillStyle = gold;
      ctx.font = `700 20px ${display}`;
      ctx.textAlign = 'left';
      ctx.fillText(text, pad, y);
    }

    function drawLabel(text, x, y) {
      ctx.fillStyle = gray400;
      ctx.font = `500 14px ${display}`;
      ctx.textAlign = 'left';
      ctx.fillText(text, x, y);
    }

    function drawValue(text, x, y, size) {
      ctx.fillStyle = gray100;
      ctx.font = `600 ${size || 22}px ${display}`;
      ctx.textAlign = 'left';
      ctx.fillText(text, x, y);
    }

    function drawResultCircles(results, x, y, r) {
      const radius = r || 16;
      const gap = radius * 2 + 10;
      results.forEach((m, i) => {
        const cx = x + i * gap + radius;
        ctx.beginPath();
        ctx.arc(cx, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = m.result === 'W' ? winColor : m.result === 'L' ? lossColor : drawColor;
        ctx.fill();
        ctx.fillStyle = white;
        ctx.font = `700 ${radius}px ${display}`;
        ctx.textAlign = 'center';
        ctx.fillText(m.result, cx, y + radius * 0.35);
      });
      ctx.textAlign = 'left';
    }

    // ── Background ──
    ctx.fillStyle = gray950;
    ctx.fillRect(0, 0, W, H);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(26,26,26,0.95)');
    grad.addColorStop(1, 'rgba(10,10,10,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Top accent bar
    ctx.fillStyle = burgundy;
    ctx.fillRect(0, 0, W, 5);

    // ── Load logos ──
    const oppSlug = normalizeTeamNameForLogo(data.opponent.opponent);
    const [atlLogo, oppLogo, ssBadge] = await Promise.all([
      loadImage('/logos/atlanta-united.svg'),
      loadImage(`/logos/${oppSlug}.svg`),
      loadImage('/badge_community.png')
    ]);

    // Watermark logos (faint, behind everything)
    if (atlLogo) {
      ctx.globalAlpha = 0.07;
      ctx.drawImage(atlLogo, -80, H / 2 - 250, 500, 500);
      ctx.globalAlpha = 1;
    }
    if (oppLogo) {
      ctx.globalAlpha = 0.07;
      ctx.drawImage(oppLogo, W - 420, H / 2 - 250, 500, 500);
      ctx.globalAlpha = 1;
    }

    // ═══════════════════════════════════════════
    // HEADER (y: 20–220)
    // ═══════════════════════════════════════════
    const logoSize = 120;
    const logoY = 30;
    const centerX = W / 2;

    // ATL logo (left of center)
    if (atlLogo) ctx.drawImage(atlLogo, centerX - 200 - logoSize / 2, logoY, logoSize, logoSize);

    // "VS"
    ctx.fillStyle = gray400;
    ctx.font = `600 28px ${display}`;
    ctx.textAlign = 'center';
    ctx.fillText('VS', centerX, logoY + 75);

    // Opponent logo (right of center)
    if (oppLogo) ctx.drawImage(oppLogo, centerX + 200 - logoSize / 2, logoY, logoSize, logoSize);

    // Team names
    ctx.font = `600 18px ${display}`;
    ctx.fillStyle = gold;
    ctx.fillText('ATLANTA UNITED', centerX - 200, logoY + logoSize + 24);
    ctx.fillStyle = gray100;
    ctx.fillText(data.opponent.opponent.toUpperCase(), centerX + 200, logoY + logoSize + 24);

    // Match info
    ctx.fillStyle = gold;
    ctx.font = `700 24px ${display}`;
    ctx.fillText('MATCH PREVIEW', centerX, logoY + logoSize + 62);

    ctx.fillStyle = gray100;
    ctx.font = `500 18px ${body}`;
    ctx.fillText(formatDateNice(matchDate), centerX, logoY + logoSize + 88);

    const venueText = venue === 'home' ? 'Mercedes-Benz Stadium' : `Away · ${data.opponent.opponent}`;
    ctx.fillStyle = gray400;
    ctx.font = `400 16px ${body}`;
    ctx.fillText(`${competition} · ${venueText}`, centerX, logoY + logoSize + 112);

    let y = 280;
    drawDivider(y);

    // ═══════════════════════════════════════════
    // SECTION 1 — Head to Head (y: ~290–430)
    // ═══════════════════════════════════════════
    y += 30;
    drawSectionTitle('HEAD TO HEAD', y);

    const stats = data.opponent.stats;
    y += 35;

    // All-time record — big and centered
    drawLabel('ALL-TIME RECORD', pad, y);
    y += 30;
    drawValue(`${stats.wins}W - ${stats.draws}D - ${stats.losses}L`, pad, y, 28);

    // Stats row: Streak, Home, Away
    const statColW = (W - pad * 2) / 3;
    y += 45;
    drawLabel('STREAK', pad, y);
    drawLabel('HOME RECORD', pad + statColW, y);
    drawLabel('AWAY RECORD', pad + statColW * 2, y);
    y += 26;
    if (stats.currentStreak) {
      const sColor = stats.currentStreak.type === 'W' ? winColor : stats.currentStreak.type === 'L' ? lossColor : drawColor;
      ctx.fillStyle = sColor;
      ctx.font = `700 24px ${display}`;
      ctx.textAlign = 'left';
      ctx.fillText(`${stats.currentStreak.type}${stats.currentStreak.count}`, pad, y);
    }
    drawValue(`${stats.homeWins}W-${stats.homeDraws}D-${stats.homeLosses}L`, pad + statColW, y, 20);
    drawValue(`${stats.awayWins}W-${stats.awayDraws}D-${stats.awayLosses}L`, pad + statColW * 2, y, 20);

    // Last meetings circles
    y += 42;
    const recentMatches = [...data.opponent.matches]
      .sort((a, b) => new Date(b.date) - new Date(a.date))
      .slice(0, 5);
    const recentLabel = recentMatches.length === 1 ? 'LAST MEETING' : `LAST ${recentMatches.length} MEETINGS`;
    drawLabel(recentLabel, pad, y);
    y += 30;
    drawResultCircles(recentMatches, pad, y);

    y += 35;
    drawDivider(y);

    // ═══════════════════════════════════════════
    // SECTION 2 — Atlanta United Form (y: ~540–700)
    // ═══════════════════════════════════════════
    y += 30;
    drawSectionTitle('ATLANTA UNITED — ' + new Date().getFullYear() + ' SEASON', y);

    const atlMatches = data.matches.matches || [];
    const atlSorted = [...atlMatches].sort((a, b) => new Date(a.date) - new Date(b.date));
    const atlRecent = atlSorted.slice(-5);
    const summary = data.matches.summary;

    // Form circles
    y += 30;
    const formLabel = atlRecent.length === 1 ? 'RECENT FORM (LAST MATCH)' : `RECENT FORM (LAST ${atlRecent.length})`;
    drawLabel(formLabel, pad, y);
    y += 30;
    drawResultCircles(atlRecent, pad, y);

    // Season record + xG stats
    y += 45;
    drawLabel('RECORD', pad, y);
    drawLabel('GOALS FOR / AGAINST', pad + statColW, y);
    y += 26;
    drawValue(`${summary.wins}W - ${summary.draws}D - ${summary.losses}L`, pad, y, 22);
    drawValue(`${summary.goalsFor} / ${summary.goalsAgainst}`, pad + statColW, y, 22);

    const atlInsights = data.insights;
    if (atlInsights && atlInsights.context) {
      const c = atlInsights.context;
      const gp = c.games_played || 1;

      y += 40;
      drawLabel('XG FOR / AGAINST (PER GAME)', pad, y);
      drawLabel('POINTS / XPOINTS', pad + statColW * 1.5, y);
      y += 26;
      drawValue(`${(c.xgoals_for / gp).toFixed(2)} / ${(c.xgoals_against / gp).toFixed(2)}`, pad, y, 22);
      drawValue(`${c.points} / ${c.xpoints.toFixed(1)}`, pad + statColW * 1.5, y, 22);
    }

    y += 40;
    drawDivider(y);

    // ═══════════════════════════════════════════
    // SECTION 3 — Opponent Form (y: ~760–890)
    // ═══════════════════════════════════════════
    y += 30;
    drawSectionTitle(`${data.opponent.opponent.toUpperCase()} — ${new Date().getFullYear()} SEASON`, y);

    const leagueTable = data.league && data.league.table ? data.league.table : [];
    const oppTeam = leagueTable.find(t =>
      normalizeTeamNameForLogo(t.team_name) === normalizeTeamNameForLogo(data.opponent.opponent)
    );

    if (oppTeam) {
      const gp = oppTeam.games_played || 1;

      y += 22;
      ctx.fillStyle = gray400;
      ctx.font = `italic 400 13px ${body}`;
      ctx.textAlign = 'left';
      ctx.fillText('Season stats via MLS xG standings', pad, y);

      y += 30;
      drawLabel('POINTS', pad, y);
      drawLabel('GOAL DIFF', pad + statColW, y);
      drawLabel('XG DIFF', pad + statColW * 2, y);
      y += 26;
      drawValue(`${oppTeam.points} in ${gp} GP`, pad, y, 22);
      const gdSign = oppTeam.goal_diff >= 0 ? '+' : '';
      drawValue(`${gdSign}${oppTeam.goal_diff}`, pad + statColW, y, 22);
      const xgdSign = oppTeam.xgoal_diff >= 0 ? '+' : '';
      drawValue(`${xgdSign}${oppTeam.xgoal_diff.toFixed(1)}`, pad + statColW * 2, y, 22);

      y += 40;
      drawLabel('XG FOR / AGAINST (PER GAME)', pad, y);
      drawLabel('GOALS FOR / AGAINST', pad + statColW * 1.5, y);
      y += 26;
      drawValue(`${(oppTeam.xgoals_for / gp).toFixed(2)} / ${(oppTeam.xgoals_against / gp).toFixed(2)}`, pad, y, 22);
      drawValue(`${oppTeam.goals_for} / ${oppTeam.goals_against}`, pad + statColW * 1.5, y, 22);
    } else {
      y += 35;
      ctx.fillStyle = gray400;
      ctx.font = `400 16px ${body}`;
      ctx.textAlign = 'left';
      ctx.fillText('No season data available yet', pad, y);
    }

    y += 40;
    drawDivider(y);

    // ═══════════════════════════════════════════
    // SECTION 4 — Key ATL Players (y: ~950–1150)
    // ═══════════════════════════════════════════
    y += 30;
    drawSectionTitle('KEY ATLANTA UNITED PLAYERS', y);

    // Aggregate player stats
    const playerMap = {};
    atlMatches.forEach(m => {
      if (!m.players) return;
      m.players.forEach(p => {
        if (!playerMap[p.name]) {
          playerMap[p.name] = { name: p.name, goals: 0, assists: 0, xg: 0, xa: 0, xgPlusXa: 0, minutes: 0 };
        }
        playerMap[p.name].goals += p.goals || 0;
        playerMap[p.name].assists += p.assists || 0;
        playerMap[p.name].xg += p.xg || 0;
        playerMap[p.name].xa += p.xa || 0;
        playerMap[p.name].xgPlusXa += p.xgPlusXa || 0;
        playerMap[p.name].minutes += p.minutes || 0;
      });
    });

    const playerList = Object.values(playerMap);
    const topScorers = [...playerList].sort((a, b) => b.goals - a.goals).filter(p => p.goals > 0).slice(0, 3);
    const topContributors = [...playerList].sort((a, b) => b.xgPlusXa - a.xgPlusXa).slice(0, 3);

    // Top scorers
    y += 30;
    drawLabel('TOP SCORERS', pad, y);
    topScorers.forEach((p, i) => {
      y += 32;
      ctx.fillStyle = gray100;
      ctx.font = `500 18px ${display}`;
      ctx.textAlign = 'left';
      ctx.fillText(p.name, pad, y);
      ctx.fillStyle = gold;
      ctx.font = `700 18px ${display}`;
      ctx.textAlign = 'right';
      ctx.fillText(`${p.goals}G  (${p.xg.toFixed(1)} xG)`, W / 2 - 20, y);
    });

    // Top xG+xA contributors
    y += 40;
    drawLabel('TOP XG+XA CONTRIBUTORS', pad, y);
    topContributors.forEach((p, i) => {
      y += 32;
      ctx.fillStyle = gray100;
      ctx.font = `500 18px ${display}`;
      ctx.textAlign = 'left';
      ctx.fillText(p.name, pad, y);
      ctx.fillStyle = gold;
      ctx.font = `700 18px ${display}`;
      ctx.textAlign = 'right';
      ctx.fillText(`${p.xgPlusXa.toFixed(1)} xG+xA`, W / 2 - 20, y);
    });

    // ═══════════════════════════════════════════
    // FOOTER (bottom 90px)
    // ═══════════════════════════════════════════
    const footerY = H - 90;

    // Footer background
    ctx.fillStyle = 'rgba(128, 0, 10, 0.12)';
    ctx.fillRect(0, footerY, W, 90);
    drawDivider(footerY);

    // S&S badge
    if (ssBadge) {
      ctx.drawImage(ssBadge, pad, footerY + 18, 44, 44);
    }

    ctx.fillStyle = gold;
    ctx.font = `700 18px ${display}`;
    ctx.textAlign = 'left';
    ctx.fillText('SCARVESANDSPIKES.COM', pad + 54, footerY + 38);
    ctx.fillStyle = gray400;
    ctx.font = `400 13px ${body}`;
    ctx.fillText('stats.scarvesandspikes.com', pad + 54, footerY + 56);

    // Data source
    ctx.fillStyle = gray400;
    ctx.font = `400 12px ${body}`;
    ctx.textAlign = 'right';
    ctx.fillText('Data: American Soccer Analysis', W - pad, footerY + 38);
    ctx.fillText(`Generated ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`, W - pad, footerY + 56);

    // Bottom accent bar
    ctx.fillStyle = gold;
    ctx.fillRect(0, H - 5, W, 5);

    // Store blob for download
    generatedBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  // ── Download ──
  function download() {
    if (!generatedBlob) return;
    const oppSlug = document.getElementById('opponentSelect').value;
    const url = URL.createObjectURL(generatedBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ATLUTD-vs-${oppSlug}-preview.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ── Boot ──
  init();
</script>
</body>
</html>
